name: 问题反馈
description: 报告可复现的软件问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "请勿上传小说正文、项目数据库、模型密钥或含私人内容的截图。安全漏洞请先阅读 SECURITY.md，勿公开细节。"
  - type: input
    id: version
    attributes:
      label: 墨境版本
      placeholder: 例如 1.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 64 位
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用虚构或脱敏数据说明操作顺序。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前检查
      options:
        - label: 我已移除作品、数据库、密钥及其他私人资料。
          required: true
